x-common-environment: &common-environment
  BACKUP_ROOT: /backups
  BACKUP_HOST_PATH: ${BACKUP_HOST_PATH:?Set BACKUP_HOST_PATH in .env}
  DATA_DIR: /data
  APP_VERSION: ${APP_VERSION:-0.1.0}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
  TRANSFER_CONCURRENCY: ${TRANSFER_CONCURRENCY:-2}
  TRANSFER_MAX_ATTEMPTS: ${TRANSFER_MAX_ATTEMPTS:-5}
  WORKER_LEASE_MS: ${WORKER_LEASE_MS:-300000}
  MIN_FREE_BYTES: ${MIN_FREE_BYTES:-536870912}
  GIT_TIMEOUT_MS: ${GIT_TIMEOUT_MS:-1800000}
  RCLONE_TIMEOUT_MS: ${RCLONE_TIMEOUT_MS:-3600000}
  ARTIFACT_ROOT: /backups/.artifacts
  PUBLIC_URL: ${PUBLIC_URL:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  FORCE_HTTPS: ${FORCE_HTTPS:-false}
  SESSION_IDLE_MS: ${SESSION_IDLE_MS:-1800000}
  SESSION_ABSOLUTE_MS: ${SESSION_ABSOLUTE_MS:-43200000}

services:
  app:
    build: .
    image: ${BACKMYGIT_IMAGE:-drakonis96/backmygit:latest}
    container_name: backmygit
    restart: unless-stopped
    ports:
      # Loopback by default. Set APP_BIND_ADDRESS explicitly only when a trusted
      # reverse proxy cannot reach the service through a Docker network.
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8787}:8787"
    environment:
      <<: *common-environment
      PROCESS_ROLE: web
    volumes:
      # Actual Git backups live directly at this editable host path.
      - ${BACKUP_HOST_PATH}:/backups
      # Only application state (SQLite) uses a Docker-managed volume.
      - app-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  worker:
    image: ${BACKMYGIT_IMAGE:-drakonis96/backmygit:latest}
    restart: unless-stopped
    command: ["node", "dist-server/worker-entry.js"]
    environment:
      <<: *common-environment
      PROCESS_ROLE: worker
    volumes:
      - ${BACKUP_HOST_PATH}:/backups
      - app-data:/data
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  app-data:
